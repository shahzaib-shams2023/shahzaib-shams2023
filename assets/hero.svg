<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="Shahzaib, Full Stack Engineer focused on AI and cloud, based in Pakistan" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
