<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Six engineering principles" xmlns:c2pa="http://c2pa.org/manifest"><rect x="0.5" y="0.5" width="315" height="103" rx="16" fill="#0f121a" stroke="#232838"/>
<rect x="0.5" y="24" width="3" height="56" rx="1.5" fill="#8B5CF6"/>
<text x="26" y="34" font-family="'SF Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#8B5CF6">01</text>
<text x="26" y="62" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#e6e8ee">Build useful things</text>
<text x="26" y="84" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8a92a6">Not impressive. Not clever. Useful.</text><rect x="342.5" y="0.5" width="315" height="103" rx="16" fill="#0f121a" stroke="#232838"/>
<rect x="342.5" y="24" width="3" height="56" rx="1.5" fill="#22D3EE"/>
<text x="368" y="34" font-family="'SF Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#22D3EE">02</text>
<text x="368" y="62" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#e6e8ee">Keep systems simple</text>
<text x="368" y="84" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8a92a6">Complexity is a debt you pay forever.</text><rect x="684.5" y="0.5" width="315" height="103" rx="16" fill="#0f121a" stroke="#232838"/>
<rect x="684.5" y="24" width="3" height="56" rx="1.5" fill="#F472B6"/>
<text x="710" y="34" font-family="'SF Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#F472B6">03</text>
<text x="710" y="62" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#e6e8ee">Automate the repeatable</text>
<text x="710" y="84" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8a92a6">Do it twice, script it.</text><rect x="0.5" y="126.5" width="315" height="103" rx="16" fill="#0f121a" stroke="#232838"/>
<rect x="0.5" y="150" width="3" height="56" rx="1.5" fill="#22D3EE"/>
<text x="26" y="160" font-family="'SF Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#22D3EE">04</text>
<text x="26" y="188" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#e6e8ee">Ship fast</text>
<text x="26" y="210" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8a92a6">Working today beats perfect never.</text><rect x="342.5" y="126.5" width="315" height="103" rx="16" fill="#0f121a" stroke="#232838"/>
<rect x="342.5" y="150" width="3" height="56" rx="1.5" fill="#F472B6"/>
<text x="368" y="160" font-family="'SF Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#F472B6">05</text>
<text x="368" y="188" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#e6e8ee">Improve continuously</text>
<text x="368" y="210" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8a92a6">Never done. Refactor, learn, repeat.</text><rect x="684.5" y="126.5" width="315" height="103" rx="16" fill="#0f121a" stroke="#232838"/>
<rect x="684.5" y="150" width="3" height="56" rx="1.5" fill="#8B5CF6"/>
<text x="710" y="160" font-family="'SF Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#8B5CF6">06</text>
<text x="710" y="188" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#e6e8ee">Tea before code</text>
<text x="710" y="210" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8a92a6">Non-negotiable.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>